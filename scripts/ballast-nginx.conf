# Ballast public site — nginx server block for ballast.beyondkaira.com
#
# EXTRACTED VERBATIM from docs/public-site-deploy.md §2 by scripts/deploy_public_site.sh's
# author, and re-extractable at any time:
#
#   python3 - <<'EOF'
#   import re; doc=open("docs/public-site-deploy.md").read()
#   print(re.search(r"```nginx\n(.*?)```", doc, re.S).group(1))
#   EOF
#
# The runbook stays the EXPLANATION (why explicit locations, why a real 404, what
# the silent-200 on the apex taught us). This file is what actually gets copied to
# /etc/nginx/sites-available/. If you change one, re-extract the other in the same
# commit — a config that disagrees with its own documentation is worse than either.
#
# NOTE THE COST THIS BLOCK DELIBERATELY ACCEPTS: it serves EXPLICIT locations and
# returns a real 404 for everything else. So adding a page means adding a location
# line here. That is on purpose — a catch-all is what made the apex answer HTTP 200
# with a 16-byte body for every path, which no status-code monitor could ever catch.
#
# VALIDATED WITH A REAL `nginx -t`, not by reading documentation. Method, so it can
# be repeated after any edit: wrap this file in a minimal `events {} http { ... }`,
# point the four TLS paths at a throwaway self-signed cert plus a 2048-bit dhparam
# (512 is rejected outright by modern OpenSSL), redirect the log/temp paths into a
# writable directory, and run `nginx -t -c <wrapper> -p <dir>`. A clean result reads
# "syntax is ok" and then fails on `bind() to 0.0.0.0:80 ... Permission denied`,
# which is the unprivileged environment and not the config.
#
# THAT VALIDATION EARNED ITS KEEP IMMEDIATELY: it caught `http2 on;`, which is
# nginx >= 1.25.1 syntax and an [emerg] unknown-directive on anything older. The
# origin hides its version (`Server: nginx`), and Ubuntu LTS still ships 1.24.0 —
# so the first deploy would very likely have aborted at `nginx -t`. See the
# comment on the listen directives below.

server {
    listen 80;
    listen [::]:80;
    server_name ballast.beyondkaira.com;

    # ACME needs plain HTTP on this path; everything else goes to TLS. Written in
    # the exact form the estate's other eight vhosts use — `^~` so the carve-out
    # can never lose to a regex location added later, plus the explicit
    # `default_type`/`try_files` (a challenge token served as the wrong type, or
    # a missing one answered by the redirect, both fail renewal SILENTLY, which
    # is the failure mode that costs a site its certificate 60 days from now).
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; default_type "text/plain"; try_files $uri =404; }
    location / { return 301 https://$host$request_uri; }
}

server {
    # HTTP/2 is requested in the LISTEN directive, not with `http2 on;`, and the
    # difference is a deploy-aborting one. `http2 on;` is nginx >= 1.25.1 syntax;
    # on anything older it is not a warning but `[emerg] unknown directive "http2"`,
    # which fails `nginx -t` and stops the deploy dead. The origin hides its version
    # (`Server: nginx`, no number), so this cannot be checked before connecting —
    # and the build machine, an Ubuntu box, runs 1.24.0, which is what Ubuntu LTS
    # still ships. The `listen ... http2` form works on EVERY version; on 1.25.1+
    # it emits a deprecation warning and functions normally. A warning on new nginx
    # beats an emerg on old nginx for a step the operator performs exactly once.
    # (Validated with a real `nginx -t` against this block, not by reading docs.)
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ballast.beyondkaira.com;

    # THE CERT IS THE SHARED SAN BUNDLE, NOT A PER-HOST ONE — and this line was
    # wrong until it was checked against the running server rather than assumed.
    #
    # It read `/etc/letsencrypt/live/ballast.beyondkaira.com/…`, which is what
    # `certbot certonly -d ballast.beyondkaira.com` would have produced. The
    # origin does not work that way. Measured on the box (2026-08-02): every one
    # of the eight live vhosts reads `/etc/letsencrypt/live/beyondkaira.com/`,
    # and the certificate served on :443 carries all eight names in one SAN list
    # (ams · bedirhandemirel · beyondkaira.com · brier · matbu · pulse · www ·
    # yanki — read straight off the wire with `openssl s_client | openssl x509`).
    # `--cert-name beyondkaira.com` is what keeps that path stable as names are
    # added, which is why §3 uses `--expand` and not a fresh `certonly`.
    #
    # The failure this prevents is not subtle and it is not recoverable by
    # retrying: nginx cannot open a cert file that does not exist, so `nginx -t`
    # aborts at step 3 of the runbook — BEFORE certbot has run — and the
    # operator is left with a symlinked-but-broken site and no obvious cause.
    ssl_certificate     /etc/letsencrypt/live/beyondkaira.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/beyondkaira.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/ballast;
    index index.html;

    # No credentials, no forms, no third-party anything on these pages — so the
    # policy can be this strict, and a strict policy is free evidence for the
    # privacy claims the app itself makes.
    add_header X-Content-Type-Options    "nosniff"                  always;
    add_header X-Frame-Options           "DENY"                     always;
    add_header Referrer-Policy           "no-referrer"              always;
    add_header Strict-Transport-Security "max-age=31536000"         always;
    add_header Content-Security-Policy   "default-src 'none'; style-src 'self' 'unsafe-inline'; img-src 'self'" always;

    # EXPLICIT locations. Extensionless URLs, because the app links to
    # /terms and /privacy with no suffix (Shared/Sources/AppIdentifiers.swift).
    location = /terms   { try_files /terms.html   =404; }
    location = /privacy { try_files /privacy.html =404; }
    location = /        { try_files /index.html   =404; }

    # /beta is the page you share with testers. Extensionless to match the others,
    # and worth a redirect from the .html form because people will type it.
    location = /beta       { try_files /beta.html =404; }
    location = /beta.html  { return 301 https://$host/beta; }

    # /support is REQUIRED, not optional: App Store Connect will not accept a
    # listing without a reachable Support URL, and this is the page that field
    # points at. Same extensionless shape and the same .html redirect.
    location = /support      { try_files /support.html =404; }
    location = /support.html { return 301 https://$host/support; }

    # The link-preview image every page's og:image points at. Needed because
    # img-src is 'self' — an image served from anywhere else is blocked, and a
    # page whose og:image 404s previews worse than one with no tag at all.
    location = /icon.png   { try_files /icon.png =404; }

    # robots.txt must be reachable, and it is the ONLY file outside the set above
    # that is. It disallows crawling while trademark clearance (gate G0) is open.
    location = /robots.txt { try_files /robots.txt =404; }

    # Anything else is a REAL 404 — never a friendly 200. See §1 conclusion 3.
    location / { return 404; }
}
