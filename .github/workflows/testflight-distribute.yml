# Manual TestFlight distribution — attach EXISTING builds to a tester group.
#
# The CI pipeline attaches each new build automatically (see the
# `testflight-distribute` job in ci.yml). This workflow exists for the other case:
# builds that were uploaded BEFORE that job existed, which nothing has ever handed
# to a tester group. Run it once with a sweep large enough to cover them, and the
# back-fill is done.
#
# It runs on ubuntu, so it costs no macOS minutes — the polling is free.
#
# Requires the same secrets the TestFlight lane already uses:
#   ASC_KEY_ID · ASC_ISSUER_ID · ASC_API_KEY_P8_BASE64
name: TestFlight distribute (manual)

on:
  workflow_dispatch:
    inputs:
      group:
        description: "TestFlight beta group name (exact, as it appears in App Store Connect)"
        required: true
        default: "Friends"
      sweep:
        description: "How many of the newest builds to attach (1 = just the latest)"
        required: true
        default: "1"

concurrency:
  group: testflight-distribute
  cancel-in-progress: false

jobs:
  distribute:
    name: Attach builds to the tester group
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ASC API deps
        run: pip install --quiet pyjwt cryptography
      - name: Preflight — are the ASC secrets provisioned?
        env:
          ASC_KEY: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          if [ -z "$ASC_KEY" ]; then
            echo "::error title=TestFlight secrets missing::ASC_API_KEY_P8_BASE64 is not set. Provision ASC_KEY_ID, ASC_ISSUER_ID and ASC_API_KEY_P8_BASE64 first — see fastlane/Fastfile."
            exit 1
          fi
      - name: Distribute
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          python3 scripts/testflight_distribute.py \
            --bundle-id com.beyondkaira.ballast \
            --group "${{ inputs.group }}" \
            --create-if-missing \
            --sweep "${{ inputs.sweep }}"
